<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../shared/theme.js"></script>
    <link rel="stylesheet" href="settings-page.css">
    <link rel="stylesheet" href="../shared/menu.css">
    <link rel="stylesheet" href="../catfish.css">
    <link rel="stylesheet" href="../shared/theme.css">
    <script src="../shared/menu.js" defer></script>
    <script src="settings-page.js" defer></script>
    <script src="../catfish.js" defer></script>
    <title>Beállítások</title>
</head>
<body>
    <!-- From Uiverse.io by kiranmayee-abbireddy -->
    <div class="uiverse-midnight-sky">
        <div class="sky-canvas">
        <div class="stars stars-1"></div>
        <div class="stars stars-2"></div>
        <div class="stars stars-3"></div>

        <div class="meteor m1"></div>
        <div class="meteor m2"></div>
        <div class="meteor m3"></div>

        <div class="moon"></div>
        </div>
    </div>

    <!-- Top bar: the menu button sits on its left, the user on its right -->
    <header class="navbar">
        <div class="profile">
            <span id="navUsername">Felhasználó</span>
            <img class="avatar" src="../images/default-avatar.svg" alt="Profilkép">
        </div>
    </header>

    <button class="menu-toggle" id="menuToggle" type="button"
            aria-label="Menü" aria-expanded="false" aria-controls="sideMenu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="menu-backdrop" id="menuBackdrop"></div>

    <nav class="side-menu" id="sideMenu" aria-hidden="true">
        <h2>Menü</h2>
        <a href="../settings-page/settings-page.html" aria-current="page">Beállítások</a>
        <a href="#" data-action="logout">Kijelentkezés</a>
    </nav>

    <main class="settings">
        <h1>Beállítások</h1>

        <section class="card">
            <h2>Megjelenés</h2>
            <div class="segmented" role="radiogroup" aria-label="Téma">
                <!-- settings-page.js marks the saved theme -->
                <button type="button" role="radio" data-theme-choice="dark" aria-checked="false">Sötét</button>
                <button type="button" role="radio" data-theme-choice="light" aria-checked="false">Világos</button>
            </div>
            <p class="hint">Világos módban nappali ég van, és a holdból nap lesz – a harcsa marad.</p>
        </section>

        <section class="card">
            <h2>Értesítések</h2>
            <!-- Two dropdowns instead of <input type="time">, which shows AM/PM on some phones -->
            <div class="setting-row">
                <span id="reminderLabel">Dolgozat-emlékeztető időpontja</span>
                <div class="time-picker" role="group" aria-labelledby="reminderLabel">
                    <select id="reminderHour" aria-label="Óra"></select>
                    <span aria-hidden="true">:</span>
                    <select id="reminderMinute" aria-label="Perc"></select>
                </div>
            </div>
            <p class="hint">A dolgozat előtti 3 napon minden nap ekkor kapsz emlékeztetőt.</p>
            <p class="saved" id="reminderSaved" hidden></p>
        </section>
    </main>

    <!-- Bottom bar: switches between the main pages (same look as the top bar) -->
    <nav class="bottom-bar" aria-label="Oldalak">
        <a href="../main-page/main.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
            <span>Főoldal</span>
        </a>
        <a href="../calendar-page/calendar-page.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 9h14v11H5z"/></svg>
            <span>Naptár</span>
        </a>
    </nav>
</body>
</html>
