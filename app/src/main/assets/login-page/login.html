<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
  <title>Dolgozat Naptár</title>
</head>
<body>
  <!-- From Uiverse.io by kiranmayee-abbireddy --> 
  <div class="uiverse-midnight-sky">
    <div class="sky-canvas">
      <div class="stars stars-1"></div>
      <div class="stars stars-2"></div>
      <div class="stars stars-3"></div>
  
      <div class="meteor m1"></div>
      <div class="meteor m2"></div>
      <div class="meteor m3"></div>

      <div class="moon"></div>
    </div>
  </div>


  <div class="containter">
    <h1>Dolgozat Naptár</h1>
    <form id="loginform">
      <label for="username">Felhasználónév</label>
      <br>
      <input type="text" name="username" id="username" required>
      <br>
      <label for="password">Jelszó</label>
      <br>
      <input type="password" name="password" id="password" required>
      <br>
      <button id="loginBtn" type="submit">Bejelentkezés</button>
      <p id="feedbackMessage">INSERT MESSAGE HERE</p>
      <a href="../registration-page/registration.html">Regisztráció</a>
    </form>
  </div>
</body>
</html>
